name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
      name: Deploy
      runs-on: ubuntu-latest
      permissions:
          id-token: write
          contents: read

      steps:
        - name: Check out code
          uses: actions/checkout@v6

        - name: Set up Go
          uses: actions/setup-go@v6
          with:
              go-version: "1.27.1"

        - name: Build the app
          run: ./scripts/buildprod.sh

        - id: 'auth'
          uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: projects/154796145387/locations/global/workloadIdentityPools/github/providers/my-repo
            service_account: cloud-run-deployer@project.iam.gserviceaccount.com

        - name: Set up gcloud SDK
          uses: google-github-actions/setup-gcloud@v3
          with:
              version: ">=591.0.0"

        - name: Build & push the docker image
          run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-513305/notely-ar-repo/notely:latest .
